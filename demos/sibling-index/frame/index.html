<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sibling Index Demo</title>
    <link rel="stylesheet" href="../../shared.css">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <style>
        body {
            margin: 0;
            padding: 0;
        }

        .controls {
            margin-top: 3rem;
        }

        .card-stack {
            position: relative;
            width: 200px;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .note {
            position: absolute;
            width: 140px;
            height: 140px;
            background: #fff9c4;
            border: 2px solid #333;
            padding: 1rem;
            box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.15);
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 1.2rem;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            text-align: center;
            color: #333;
            rotate: calc((sibling-index() - (sibling-count() / 2) - 0.5) * 12deg);
            transform: translateY(calc(abs(sibling-index() - (sibling-count() / 2) - 0.5) * 8px));
            z-index: sibling-index();
            background-color: hsl(360 calc(mod(sibling-index() * 39, 360) * 1%) 85%);
        }
    </style>
</head>

<body>
    <div class="demo-container">
        <div class="card-stack" id="stack">
            <div class="note">Note 1</div>
            <div class="note">Note 2</div>
            <div class="note">Note 3</div>
            <div class="note">Note 4</div>
        </div>
        <div class="controls">
            <button id="addBtn">Add Note</button>
            <button id="removeBtn">Remove Note</button>
        </div>
    </div>
</body>

</html>
